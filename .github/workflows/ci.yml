name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: moja_kuchnia_ci
          POSTGRES_PASSWORD: moja_kuchnia_ci_test
          POSTGRES_DB: moja_kuchnia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moja_kuchnia_ci -d moja_kuchnia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      CI: "true"
      API_HOST: 127.0.0.1
      API_PORT: "3101"
      DATABASE_URL: postgresql://moja_kuchnia_ci:moja_kuchnia_ci_test@127.0.0.1:5432/moja_kuchnia_test
      CORS_ORIGINS: http://127.0.0.1:3100
      API_ORIGIN: http://127.0.0.1:3101
      PUBLIC_WEB_ORIGIN: http://127.0.0.1:3100
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-test-only-not-a-real-secret-32ch
      AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3100
      ALLOW_DEMO_SEED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          node <<'EOF'
          const net = require("net");
          function canConnect() {
            return new Promise((resolve) => {
              const socket = net.connect({ host: "127.0.0.1", port: 5432 }, () => {
                socket.end();
                resolve(true);
              });
              socket.on("error", () => resolve(false));
            });
          }
          (async () => {
            for (let i = 1; i <= 30; i += 1) {
              if (await canConnect()) {
                console.log("PostgreSQL is ready");
                process.exit(0);
              }
              console.log(`Waiting for PostgreSQL (${i})…`);
              await new Promise((r) => setTimeout(r, 2000));
            }
            console.error("PostgreSQL did not become ready");
            process.exit(1);
          })();
          EOF
      - name: Generate Prisma client
        run: pnpm --filter @moja-kuchnia/api prisma:generate

      - name: Apply migrations
        run: pnpm --filter @moja-kuchnia/api exec prisma migrate deploy

      - name: Check USDA catalog integrity
        run: pnpm --filter @moja-kuchnia/api usda:check-catalog

      - name: Generate OpenAPI and API client
        run: pnpm api:generate

      - name: Assert generated API client is committed
        run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm --filter @moja-kuchnia/api test:unit

      - name: API e2e tests
        run: pnpm --filter @moja-kuchnia/api test:e2e

      - name: Auth black-box through Next.js
        run: pnpm test:auth-blackbox

      - name: Build monorepo
        run: pnpm build

      - name: Mobile lint
        run: pnpm --filter @moja-kuchnia/mobile lint

      - name: Mobile typecheck
        run: pnpm --filter @moja-kuchnia/mobile typecheck
