name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://moja_kuchnia:moja_kuchnia_dev@localhost:5432/moja_kuchnia
      CORS_ORIGINS: http://localhost:3000
      API_ORIGIN: http://127.0.0.1:3001
      PUBLIC_WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-test-only-not-a-real-secret-32ch
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
      ALLOW_DEMO_SEED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @moja-kuchnia/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @moja-kuchnia/web build

      - name: Build API
        run: pnpm --filter @moja-kuchnia/api build
