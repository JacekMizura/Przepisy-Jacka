services:
  postgres:
    image: postgres:18-alpine
    container_name: moja-kuchnia-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: moja_kuchnia
      POSTGRES_PASSWORD: moja_kuchnia_dev
      POSTGRES_DB: moja_kuchnia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moja_kuchnia -d moja_kuchnia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
